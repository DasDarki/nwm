version: 2
project_name: nwm

builds:
  - id: nwm
    main: .
    binary: nwm
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/DasDarki/nwm/internal/buildinfo.Version={{ .Version }}

archives:
  - formats: [binary]
    name_template: "nwm_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github
